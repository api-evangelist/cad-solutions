  many unrelated "CAD Solutions" businesses currently trading under similar names (CAD Solutions LLC,
  CAD Solutions Inc of Dassault partner fame, CADD Solutions, CAD-E Solutions) are separate entities and
  are not this Battery portfolio record. This profile is retained as a historical VC-portfolio lead with
  no API surface to catalog.
